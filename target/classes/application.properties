spring.datasource.url=jdbc:mysql://localhost:3306/cliniccam_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#
## Pool de connexions HikariCP (Spring Boot l'utilise par défaut)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
#
## JPA / HIBERNATE
## update : met à jour le schéma sans supprimer les données (dev)
## validate : vérifie seulement (production recommandée)
## create-drop : recrée la BDD à chaque démarrage (tests)
spring.jpa.hibernate.ddl-auto=update
#
## Affiche les requêtes SQL dans la console (utile pour déboguer)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#
## Dialecte PostgreSQL pour Hibernate
##spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
## Dialecte Hibernate pour MySQL 8+ (optimise les requ�tes SQL g�n�r�es)
##spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#
## JWT (JSON Web Token)
jwt.secret=bWFTdXBlckNsZVNlY3JldGVQb3VySldUMTIzNDU2Nzg5MCE=
# #${JWT_SECRET:buscam-super-secret-key-for-jwt-minimum-256-bits-required-here}
##
### Durée de validité du token : 24 heures = 86400000 ms
jwt.expiration=86400000
#  #${JWT_EXPIRATION:86400000}
### CORS (Cross-Origin Resource Sharing)
### Autorise le frontend React (Vercel) à appeler l'API
### En production, remplace * par l'URL exacte de ton frontend Vercel
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5174,https://cliniccam.vercel.app}
##
### LOGS
logging.level.com.buscam=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
##
### DONNÉES DE TEST INITIALES (DataLoader)
### Active l'injection de données de démo au démarrage
app.load-sample-data=true
